name: UI and API Automation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run UI and API tests
        run: mvn -B clean test -Dheadless=true
      - name: Upload HTML report and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: |
            reports/automation-report.html
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
